<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Demo Game</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <script>
      // Capture errors before any module loads, so module load failures are visible too.
      window.__game = { errors: [] };
      function reportError(message) {
        window.__game.errors.push(String(message));
        const banner = document.getElementById('error-banner');
        if (banner) {
          banner.hidden = false;
          banner.textContent = window.__game.errors.join('\n');
        }
      }
      window.addEventListener('error', (e) => reportError(e.error?.stack || e.message || 'Resource failed: ' + (e.target?.src || e.target?.href)), true);
      window.addEventListener('unhandledrejection', (e) => reportError(e.reason?.stack || e.reason));
    </script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main id="stage">
      <canvas id="game" aria-label="Game"></canvas>

      <div id="ui">
        <div class="hud" data-hud hidden>
          <span>Score <b data-bind="score">0</b></span>
          <span>Time <b data-bind="time">0</b></span>
        </div>

        <section class="screen" data-screen="title" hidden>
          <h1>Demo Game</h1>
          <p class="hint">Arrows / WASD / gamepad to move. Collect the white squares.</p>
          <button data-action="play">Play</button>
          <button data-action="mute" aria-pressed="false">Sound on/off</button>
          <button data-action="fullscreen">Fullscreen</button>
          <p class="hint">Best: <span data-bind="best">0</span></p>
        </section>

        <section class="screen" data-screen="pause" hidden>
          <h2>Paused</h2>
          <button data-action="resume">Resume</button>
          <button data-action="restart">Restart</button>
          <button data-action="menu">Main menu</button>
        </section>

        <section class="screen" data-screen="gameover" hidden>
          <h2>Time's up!</h2>
          <p>Score <b data-bind="final-score">0</b> · Best <b data-bind="best">0</b></p>
          <button data-action="restart">Play again</button>
          <button data-action="menu">Main menu</button>
        </section>
      </div>

      <pre id="error-banner" role="alert" hidden></pre>
    </main>
  </body>
</html>
